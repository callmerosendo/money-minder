<form [formGroup]="form" (submit)="onSubmit()" class="overlay">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="edit-transaction-title"
    aria-describedby="edit-transaction-desc"
  >
    <div class="modal__head">
      <p class="modal__eyebrow">
        {{ transaction().type === "income" ? "Ingreso" : "Egreso" }}
      </p>
      <h2 id="edit-transaction-title" class="text-xl">Editar transacción</h2>
      <p id="edit-transaction-desc" class="mt-1 text-sm text-ink-2">
        Si cambias la cuenta, se recalculan ambos saldos.
      </p>
    </div>

    <div class="grid grid-cols-1 gap-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="edit-transaction-amount" class="label mb-1 block">Monto (USD)</label>
          <input
            id="edit-transaction-amount"
            formControlName="amount"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="0.00"
            required
            class="w-full"
          />
        </div>
        <div>
          <label for="edit-transaction-date" class="label mb-1 block">Fecha</label>
          <input
            id="edit-transaction-date"
            formControlName="date"
            type="date"
            required
            class="w-full"
          />
        </div>
      </div>

      <div>
        <label for="edit-transaction-account" class="label mb-1 block">Cuenta</label>
        <select id="edit-transaction-account" formControlName="accountId" required class="w-full">
          <option value="" disabled>Selecciona una cuenta activa</option>
          @for (account of accounts(); track account.id) {
            <option [value]="account.id">
              {{ account.name }} · {{ accountTypeLabels[account.type] }}
            </option>
          }
        </select>
        @if (currentAccountArchived()) {
          <p class="mt-1 text-sm text-danger">
            La cuenta original está archivada. Elige una cuenta activa para guardar los cambios.
          </p>
        }
      </div>

      <div>
        <label for="edit-transaction-category" class="label mb-1 block">
          Categoría <span class="text-muted">(opcional)</span>
        </label>
        <select id="edit-transaction-category" formControlName="categoryId" class="w-full">
          <option value="">Sin categoría</option>
          @for (category of categories(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      </div>

      <div>
        <label for="edit-transaction-description" class="label mb-1 block">
          Descripción <span class="text-muted">(opcional)</span>
        </label>
        <input
          id="edit-transaction-description"
          formControlName="description"
          type="text"
          maxlength="500"
          placeholder="Ej. Supermercado"
          class="w-full"
        />
      </div>
    </div>

    <div class="modal__actions">
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? "Guardando..." : "Guardar cambios" }}
      </button>
      <button
        type="button"
        (click)="onClose()"
        class="btn btn--quiet"
        [disabled]="saving()"
        autofocus
      >
        Cancelar
      </button>
    </div>
  </div>
</form>
