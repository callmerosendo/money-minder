<main class="container py-10">
  <header class="border-b border-rule pb-8">
    <h1 class="max-w-[20ch] text-4xl">Bienvenido a Money Minder</h1>
    <p class="lead mt-4 max-w-[52ch] text-ink-2">
      Explora las opciones disponibles para personalizar tu experiencia y aprovechar al máximo
      nuestros servicios.
    </p>
  </header>

  <div class="mt-10 flex flex-col gap-6">
    @if (isAuth()) {
      <div class="flex flex-wrap gap-6 *:min-w-0 *:empty:hidden not-has-[>:not(:empty)]:hidden">
        <app-financial-summary class="flex-[1_1_18rem]" />
        <app-recent-transactions class="flex-[2_1_26rem]" />
      </div>

      <div class="flex flex-wrap gap-6 *:min-w-0 *:empty:hidden not-has-[>:not(:empty)]:hidden">
        <app-cash-flow class="flex-[1_1_26rem]" />
        <app-main-categories class="flex-[1_1_26rem]" />
      </div>

      <div class="flex flex-wrap gap-6 *:min-w-0 *:empty:hidden not-has-[>:not(:empty)]:hidden">
        <app-goal class="flex-[1_1_16rem]" />
        <app-reminders class="flex-[1_1_16rem]" />
        <app-quote class="flex-[1_1_16rem]" />
      </div>
    }
  </div>
</main>
