@if (hasData()) {
  <div class="@container">
    <section
      class="grid grid-cols-1 gap-0 border-y border-rule-2 @md:grid-cols-3"
      aria-label="Resumen financiero"
    >
      <div class="py-5 @md:px-5 @md:first:pl-0 @md:not-first:border-l @md:border-rule">
        <h2 class="text-sm font-normal text-muted">Balance total</h2>
        <p id="balance" class="stat-figure mt-2 text-3xl">
          {{ balance() | currency: "USD" : "symbol" }}
        </p>
      </div>

      <div class="border-t border-rule py-5 @md:border-t-0 @md:border-l @md:px-5">
        <h2 class="text-sm font-normal text-muted">Total ingresos</h2>
        <p id="entries" class="stat-figure mt-2 text-3xl">
          {{ financialSummary().totalEntries | currency: "USD" : "symbol" }}
        </p>
      </div>

      <div class="border-t border-rule py-5 @md:border-t-0 @md:border-l @md:px-5">
        <h2 class="text-sm font-normal text-muted">Total gastos</h2>
        <p id="exits" class="stat-figure mt-2 text-3xl">
          {{ financialSummary().totalExits | currency: "USD" : "symbol" }}
        </p>
      </div>
    </section>
  </div>
}
